<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f4a3a">
<title>binj</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: #1f4a3a;
    color: #f3ecdd;
    font-family: "Jost", system-ui, sans-serif;
    text-align: center;
  }
  main { max-width: 32rem; }
  .dots { display: inline-flex; gap: 0.4rem; margin-block-end: 1.5rem; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #e0a83a; }
  h1 {
    margin: 0 0 1rem;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.5rem, 8vw, 4rem);
    line-height: 1;
  }
  p { margin: 0 0 2rem; color: #c9d3c9; line-height: 1.6; }
  nav { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
  a {
    display: inline-flex;
    align-items: center;
    min-height: 2.75rem;
    padding: 0 1.5rem;
    border: 1px solid rgba(243, 236, 221, 0.4);
    border-radius: 999px;
    color: #f3ecdd;
    text-decoration: none;
    font-weight: 500;
  }
  a:hover { background: #f3ecdd; color: #1d2a24; }
  a:focus-visible { outline: 2px solid #e0a83a; outline-offset: 3px; }
  a[lang="fa"] { font-family: "Vazirmatn", system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1>Page not found</h1>
  <p>The page you were looking for does not exist. Return to the Binj Hashemi rice specification page.</p>
  <nav aria-label="Binj">
    <a href="/" hreflang="en">English</a>
    <a href="/fa/" hreflang="fa" lang="fa">فارسی</a>
  </nav>
</main>
</body>
</html>
